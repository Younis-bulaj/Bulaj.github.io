<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>كلاسيكو للناشئين — كتابة العبارات الجبرية</title>
<style>

:root{--bg:#f4f8f2;--card:#fff;--tx:#14301a;--pitch:#2e9e4f;--pitch2:#278a43;--ac:#f5a623;--bad:#d64545;--ok:#1e9e4a;--bd:#cfe0cc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a12;--card:#1a2a1e;--tx:#e8f3ea;--bd:#2f4a35}}
:root[data-theme="dark"]{--bg:#0f1a12;--card:#1a2a1e;--tx:#e8f3ea;--bd:#2f4a35}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
.w{max-width:480px;margin:0 auto;padding:12px}
h1{font-size:20px;text-align:center;margin:6px 0}
.sb{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 14px;font-weight:700}
.sb b{font-size:22px}
.pitch{position:relative;height:200px;margin:10px 0;border-radius:14px;background:repeating-linear-gradient(90deg,var(--pitch) 0 40px,var(--pitch2) 40px 80px);overflow:hidden}
.goal{position:absolute;top:30px;width:96px;height:130px;border:4px solid #fff;background:repeating-linear-gradient(45deg,rgba(255,255,255,.2) 0 2px,transparent 2px 10px),rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center}.g1{right:0;border-right:none}.g2{left:0;border-left:none}
.gk{position:absolute;top:80px;font-size:28px;transition:transform .5s;z-index:3}
.ball{position:absolute;bottom:14px;left:50%;font-size:30px;transition:all .6s cubic-bezier(.3,.7,.4,1);transform:translateX(-50%)}
.msg{position:absolute;bottom:6px;right:8px;left:8px;text-align:center;font-weight:800;font-size:22px;color:#fff;text-shadow:0 2px 4px #000}
.q{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}
.q .n{font-size:13px;opacity:.7}
.q p{font-size:17px;line-height:1.7;margin:6px 0 12px}
.fig{display:block;width:100%;max-width:320px;margin:0 auto 12px;color:var(--tx);background:var(--bg);border-radius:10px}.o{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{font:inherit;cursor:pointer}
.o button{padding:12px;border-radius:10px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);font-size:18px;font-weight:700}
.o button.r{background:var(--ok);border-color:var(--ok);color:#fff}
.o button.x{background:var(--bad);border-color:var(--bad);color:#fff}
.pl{padding:5px 10px;border-radius:9px;font-size:15px}.pl.on{background:var(--ac);color:#222}.mu{margin:8px 0 0;padding:6px 12px;border-radius:9px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}.inp{width:100%;padding:11px;margin:6px 0;border-radius:10px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit;font-size:17px}.go{display:block;width:100%;margin-top:12px;padding:13px;border:0;border-radius:12px;background:var(--ac);color:#222;font-size:18px;font-weight:800}
.w{position:relative;z-index:1}
.sb,.q{background:color-mix(in srgb,var(--card) 90%,transparent)}
.half{position:absolute;top:0;bottom:0;width:50%;display:flex;flex-direction:column;padding:8px 12px;font-size:11px;font-weight:800;color:#fff;text-shadow:0 1px 3px #000;text-align:center;transition:box-shadow .3s}
.half svg{filter:drop-shadow(0 1px 2px #0008)}
.h1{right:0;align-items:center}.h2{left:0;align-items:center;border-right:2px solid #fff}
